services:
  - type: web
    name: urbanai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: urbanai-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: urbanai-db
    databaseName: urbanai
    user: urbanai
