services:
  - type: web
    name: urbanai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: URBANPULSE_ADMIN_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: urbanai-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: urbanai-db
    databaseName: urbanai
    user: urbanai
    plan: free
