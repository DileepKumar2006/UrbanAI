<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102b47" />
    <meta name="description" content="Nagrik — Your City. Your Voice. Your Nagrik." />
    <link rel="icon" href="%PUBLIC_URL%/nagrik-mark.svg" />
    <title>Nagrik — Your City. Your Voice. Your Nagrik.</title>
    <script>
      (function(){try{var mode=localStorage.getItem('nagrik-theme')||'system';var dark=mode==='dark'||(mode==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.dataset.themeMode=mode;}catch(_){document.documentElement.dataset.theme='light';}})();
    </script>
  </head>
  <body>
    <noscript>You need JavaScript enabled to use Nagrik.</noscript>
    <div id="root"></div>
  </body>
</html>
