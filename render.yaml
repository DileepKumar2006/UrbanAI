services:
  - type: web
    name: urbanai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: URBANPULSE_ADMIN_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: dk142252@gmail.com
      - key: DEPARTMENT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://urbanai-backend-zo3b.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: urbanai-db
          property: connectionString
    healthCheckPath: /api/health

databases:
  - name: urbanai-db
    databaseName: urbanai
    user: urbanai
    plan: free
